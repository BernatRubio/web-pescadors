name: CI and deploy

on:
  pull_request:
  push:
    branches: [main]
  # Sent by the Sanity webhook when editors publish content.
  repository_dispatch:
    types: [sanity-publish]
  # Daily rebuild: "upcoming" events, the next regatta and sponsor dates are worked out
  # at build time, so the site must be rebuilt even when nobody publishes.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PUBLIC_SANITY_PROJECT_ID: ${{ vars.PUBLIC_SANITY_PROJECT_ID }}
  PUBLIC_SANITY_DATASET: ${{ vars.PUBLIC_SANITY_DATASET || 'production' }}
  PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
  PUBLIC_NOINDEX: ${{ vars.PUBLIC_NOINDEX || 'true' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm design:lint
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm --filter @pescadors/web exec playwright install --with-deps chromium
      - run: pnpm --filter @pescadors/web test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: apps/web/test-results/
          retention-days: 7

  deploy:
    needs: check
    # Only from main, and only once Cloudflare is configured in the repo settings.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pescadors/web build
      - run: pnpm --filter @pescadors/web exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
